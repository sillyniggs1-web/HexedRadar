name: Build HexedRadar AML mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native lib (armeabi-v7a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for ABI in armeabi-v7a; do
            cmake -S . -B "build/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-21 \
              -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$ABI" -j
          done

      - name: Verify exports
        run: |
          nm -D --defined-only build/armeabi-v7a/libHexedRadar.so | grep -E "HexedRadar_|OnModLoad|__GetModInfo"

      - name: Package
        run: |
          mkdir -p dist/armeabi-v7a
          cp build/armeabi-v7a/libHexedRadar.so dist/armeabi-v7a/
          cp lua/Hexed_Radar_Adjuster.lua dist/armeabi-v7a/
          ls -lR dist

      - uses: actions/upload-artifact@v4
        with:
          name: HexedRadar_AML
          path: dist
